---
# Validate and atomically deploy the committed Prometheus rules plus the narrow
# HA System Monitor scrape allow-list without
# reprovisioning CT 114, recreating PVE API tokens, or restarting the full stack.
#
# Run from the mgmt-vm, inside homelab/ansible/:
#   ansible-playbook playbooks/deploy-monitoring-rules.yml

- name: Deploy validated Prometheus rules and HA memory allow-list
  hosts: oneill
  gather_facts: false

  vars:
    monitoring_rules_host_stage: /tmp/homelab-alert-rules.source.yml
    monitoring_rules_ct_stage: /tmp/homelab-alert-rules.candidate.yml
    monitoring_rules_live: /etc/prometheus/rules/homelab.yml
    monitoring_recording_host_stage: /tmp/homelab-recording-rules.source.yml
    monitoring_recording_ct_stage: /tmp/homelab-recording-rules.candidate.yml
    monitoring_recording_live: /etc/prometheus/rules/recording.yml
    monitoring_config_host_stage: /tmp/homelab-prometheus.candidate.yml
    monitoring_config_ct_stage: /tmp/homelab-prometheus.candidate.yml
    monitoring_config_live: /etc/prometheus/prometheus.yml
    monitoring_ha_memory_regex: '(hass|homeassistant)_(sensor_(temperature_celsius|humidity_percent|battery_percent|power_w|energy_kwh|current_a|voltage_v|voltage_mv|illuminance_lx|signal_strength_dbm|precipitation_mm|pressure_hpa|carbon_dioxide_ppm|pm25_ugm3)|climate_(current|target)_temperature_celsius);.*|(hass|homeassistant)_binary_sensor_state;binary_sensor\.zigbee2mqtt_bridge_connection_state|(hass|homeassistant)_sensor_(unit_percent|data_size_mib);sensor\.system_monitor_(memory_free|memory_use|memory_usage|swap_usage|memory_pressure_some_60s_average|memory_pressure_full_60s_average)'

  tasks:
    - name: Stage the committed rules on the Proxmox host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/alert-rules.yml"
        dest: "{{ monitoring_rules_host_stage }}"
        mode: "0644"

    - name: Stage the committed recording rules on the Proxmox host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/recording-rules.yml"
        dest: "{{ monitoring_recording_host_stage }}"
        mode: "0644"

    - name: Pull the live Prometheus config for a focused allow-list update
      ansible.builtin.command:
        argv:
          - pct
          - pull
          - "{{ monitoring_ctid }}"
          - "{{ monitoring_config_live }}"
          - "{{ monitoring_config_host_stage }}"
      changed_when: true

    - name: Add the approved HA memory entities to the scrape allow-list candidate
      ansible.builtin.lineinfile:
        path: "{{ monitoring_config_host_stage }}"
        regexp: '^(\s+)regex: .*binary_sensor\\\.zigbee2mqtt_bridge_connection_state.*$'
        line: "\\1regex: '{{ monitoring_ha_memory_regex }}'"
        backrefs: true

    - name: Push the candidate rules into the monitoring CT
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ monitoring_ctid }}"
          - "{{ monitoring_rules_host_stage }}"
          - "{{ monitoring_rules_ct_stage }}"
      changed_when: true

    - name: Push the candidate recording rules into the monitoring CT
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ monitoring_ctid }}"
          - "{{ monitoring_recording_host_stage }}"
          - "{{ monitoring_recording_ct_stage }}"
      changed_when: true

    - name: Push the candidate Prometheus config into the monitoring CT
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ monitoring_ctid }}"
          - "{{ monitoring_config_host_stage }}"
          - "{{ monitoring_config_ct_stage }}"
      changed_when: true

    - name: Validate the candidate rules before promotion
      ansible.builtin.command: >-
        pct exec {{ monitoring_ctid }} --
        promtool check rules {{ monitoring_rules_ct_stage }} {{ monitoring_recording_ct_stage }}
      changed_when: false

    - name: Validate the candidate Prometheus config before promotion
      ansible.builtin.command: >-
        pct exec {{ monitoring_ctid }} --
        promtool check config {{ monitoring_config_ct_stage }}
      changed_when: false

    - name: Promote the validated rules atomically
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ monitoring_ctid }}"
          - --
          - install
          - -o
          - root
          - -g
          - root
          - -m
          - "0644"
          - "{{ monitoring_rules_ct_stage }}"
          - "{{ monitoring_rules_live }}"
      changed_when: true

    - name: Promote the validated recording rules atomically
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ monitoring_ctid }}"
          - --
          - install
          - -o
          - root
          - -g
          - root
          - -m
          - "0644"
          - "{{ monitoring_recording_ct_stage }}"
          - "{{ monitoring_recording_live }}"
      changed_when: true

    - name: Promote the validated Prometheus config atomically
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ monitoring_ctid }}"
          - --
          - install
          - -o
          - root
          - -g
          - root
          - -m
          - "0644"
          - "{{ monitoring_config_ct_stage }}"
          - "{{ monitoring_config_live }}"
      changed_when: true

    - name: Load the validated rules without restarting the monitoring stack
      ansible.builtin.command: >-
        pct exec {{ monitoring_ctid }} -- systemctl reload prometheus
      changed_when: true

    - name: Validate the deployed rules
      ansible.builtin.command: >-
        pct exec {{ monitoring_ctid }} --
        promtool check rules {{ monitoring_rules_live }} {{ monitoring_recording_live }}
      changed_when: false

    - name: Remove the host-side staging file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ monitoring_rules_host_stage }}"
        - "{{ monitoring_recording_host_stage }}"
        - "{{ monitoring_config_host_stage }}"

    - name: Remove the CT-side staging file
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ monitoring_ctid }}"
          - --
          - rm
          - -f
          - "{{ item }}"
      changed_when: true
      loop:
        - "{{ monitoring_rules_ct_stage }}"
        - "{{ monitoring_recording_ct_stage }}"
        - "{{ monitoring_config_ct_stage }}"
