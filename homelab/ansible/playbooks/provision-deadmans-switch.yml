---
# Install the independent Oneill outage notifier on Apophis (ADR-013).
# Runs every five minutes, bypasses local DNS on delivery failure, and exports its heartbeat.
# Run from ansible/: ansible-playbook playbooks/provision-deadmans-switch.yml

- name: Install the oneill dead-man's-switch on apophis
  hosts: apophis
  gather_facts: false

  tasks:
    - name: Require a private HTTPS notification destination
      ansible.builtin.assert:
        that:
          - ntfy_base_url is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
          - ntfy_topic is match('^[A-Za-z0-9_-]+$')
        quiet: true
      no_log: true

    - name: Install the watch script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/oneill-watch.sh"
        dest: /usr/local/bin/oneill-watch.sh
        owner: root
        group: root
        mode: "0755"
        validate: /bin/bash -n %s

    - name: Install the root-only watch environment
      ansible.builtin.copy:
        dest: /etc/default/oneill-watch
        owner: root
        group: root
        mode: "0600"
        content: |
          NTFY_URL={{ (ntfy_base_url ~ '/' ~ ntfy_topic) | to_json }}
          MONITORING_URL="http://{{ monitoring_ip | regex_replace('/.*$', '') }}:9090/-/healthy"
          DNS_IP="{{ technitium_ip | regex_replace('/.*$', '') }}"
      no_log: true

    - name: Ensure the exporter textfile directory exists
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the bounded watch service
      ansible.builtin.copy:
        dest: /etc/systemd/system/oneill-watch.service
        mode: "0644"
        content: |
          [Unit]
          Description=Independently check Oneill monitoring and DNS from Apophis
          Wants=network-online.target
          After=network-online.target
          [Service]
          Type=oneshot
          EnvironmentFile=/etc/default/oneill-watch
          ExecStart=/usr/local/bin/oneill-watch.sh
          TimeoutStartSec=90
          StateDirectory=oneill-watch
          StateDirectoryMode=0700
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/prometheus/node-exporter

    - name: Install the five-minute watch timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/oneill-watch.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Check Oneill independently every five minutes
          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=5min
          AccuracySec=10s
          [Install]
          WantedBy=timers.target

    - name: Remove the superseded cron entry
      ansible.builtin.file:
        path: /etc/cron.d/oneill-watch
        state: absent

    - name: Enable the independent watch timer
      ansible.builtin.systemd:
        name: oneill-watch.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Check Oneill and write the initial heartbeat
      ansible.builtin.systemd:
        name: oneill-watch.service
        state: started

    - name: Confirm the watch heartbeat exists
      ansible.builtin.stat:
        path: /var/lib/prometheus/node-exporter/homelab_oneill_watch.prom
      register: oneill_watch_heartbeat

    - name: Require an installed and running check
      ansible.builtin.assert:
        that: oneill_watch_heartbeat.stat.exists
        quiet: true
