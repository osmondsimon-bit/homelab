# Stage a disabled Telegram relay for an existing user's normal Codex context.
---
- name: Install the single Codex Telegram relay without activating it
  hosts: mgmt
  become: true
  gather_facts: true
  vars:
    telegram_source: "{{ playbook_dir }}/../../apps/codex-messaging"
    telegram_templates: "{{ playbook_dir }}/../templates/codex-messaging"
  pre_tasks:
    - name: Resolve existing user context defaults without overriding inventory
      ansible.builtin.set_fact:
        codex_telegram_user: "{{ codex_telegram_user | default('simon') }}"
        codex_telegram_home: "{{ codex_telegram_home | default('/home/' + (codex_telegram_user | default('simon'))) }}"
        codex_telegram_workspace: "{{ codex_telegram_workspace | default(codex_telegram_home | default('/home/' + (codex_telegram_user | default('simon')))) }}"

    - name: Require explicit staging and local pinned artifact paths
      ansible.builtin.assert:
        that:
          - codex_telegram_enabled | default(false) | bool
          - codex_telegram_user is match('^[a-z_][a-z0-9_-]*$')
          - codex_telegram_home is match('^/[A-Za-z0-9_./-]+$')
          - codex_telegram_workspace is match('^/[A-Za-z0-9_./-]+$')
          - codex_telegram_codex_source is defined
          - codex_telegram_bwrap_source is defined
          - codex_telegram_codex_source | default('') is match('^/')
          - codex_telegram_bwrap_source | default('') is match('^/')
          - ansible_system == 'Linux'
          - ansible_architecture == 'x86_64'
          - ansible_python.version.major == 3
          - ansible_python.version.minor >= 12
          - query('ansible.builtin.fileglob', telegram_source + '/codex_messaging/*.py') | length > 0
        fail_msg: Explicit staging, an existing user/context and both pinned local Linux x86_64 artifacts are required. This playbook never activates the relay.
        quiet: true

    - name: Inspect the two operator-supplied local artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ codex_telegram_codex_source }}"
        - "{{ codex_telegram_bwrap_source }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: telegram_artifacts

    - name: Verify official Codex 0.169.0 and static bwrap 0.13.1 bytes
      ansible.builtin.assert:
        that:
          - telegram_artifacts.results | map(attribute='stat.exists') | min
          - telegram_artifacts.results | map(attribute='stat.isreg') | min
          - not (telegram_artifacts.results | selectattr('stat.islnk') | list | length)
          - telegram_artifacts.results[0].stat.checksum == 'b452ca20f838a8855a88a41050ee4a694033fff4ea3ecdad5633e6e0e8d13f2b'
          - telegram_artifacts.results[1].stat.checksum == '711ac2c00998eede367c2b3827efa36ba4436dfce19ab9d3b6d56ff5a5996fa1'
        quiet: true
        fail_msg: Local artifact bytes do not match the reviewed release hashes.

    - name: Require the existing service user
      ansible.builtin.getent:
        database: passwd
        key: "{{ codex_telegram_user }}"

    - name: Require the existing home and a non-root identity
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[codex_telegram_user][1] | int > 0
          - ansible_facts.getent_passwd[codex_telegram_user][4] == codex_telegram_home
        quiet: true

    - name: Inspect the existing user home and workspace
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ codex_telegram_home }}"
        - "{{ codex_telegram_workspace }}"
      register: telegram_context

    - name: Require existing real context directories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir | default(false)
          - not item.stat.islnk | default(false)
          - item.item != codex_telegram_home or item.stat.uid | int == ansible_facts.getent_passwd[codex_telegram_user][1] | int
        quiet: true
      loop: "{{ telegram_context.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read installed service metadata without changing services
      ansible.builtin.service_facts:

    - name: Refuse to replace an active or enabled relay or legacy installation
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.services or (ansible_facts.services[item].state == 'stopped' and ansible_facts.services[item].status == 'disabled')
        fail_msg: Stop and disable an existing installation explicitly before staging replacement source; this playbook does neither.
        quiet: true
      loop:
        - codex-telegram.service
        - codex-messaging-broker.service
        - codex-messaging-gateway.service
        - codex-messaging-metrics.service
        - codex-messaging-metrics.timer

    - name: Inspect fixed privileged installation paths without following links
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
      loop:
        - {path: /opt/codex-messaging, kind: isdir}
        - {path: /opt/codex-messaging/codex_messaging, kind: isdir}
        - {path: /opt/codex-messaging/runtime, kind: isdir}
        - {path: /opt/codex-messaging/runtime/bin, kind: isdir}
        - {path: /opt/codex-messaging/runtime/bin/codex, kind: isreg}
        - {path: /opt/codex-messaging/runtime/bin/bwrap, kind: isreg}
        - {path: /opt/codex-messaging/entry.py, kind: isreg}
        - {path: /etc/codex-telegram.json, kind: isreg}
        - {path: /etc/systemd/system/codex-telegram.service, kind: isreg}
      register: telegram_reserved

    - name: Refuse unsafe existing privileged paths before writing
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat[item.item.kind] | default(false) and not item.stat.islnk and item.stat.uid == 0 and item.stat.mode is match('^[0-7][0-7][0145][0145]$'))
          - not item.stat.exists or item.item.kind != 'isreg' or item.stat.nlink == 1
        quiet: true
      loop: "{{ telegram_reserved.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Inspect installed package file destinations before privileged writes
      ansible.builtin.stat:
        path: "/opt/codex-messaging/codex_messaging/{{ item | basename }}"
        follow: false
      loop: "{{ query('ansible.builtin.fileglob', telegram_source + '/codex_messaging/*.py') }}"
      register: telegram_package_destinations

    - name: Refuse linked or unsafe package file destinations
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isreg and not item.stat.islnk and item.stat.uid == 0 and item.stat.nlink == 1 and item.stat.mode is match('^[0-7][0-7][0145][0145]$'))
        quiet: true
      loop: "{{ telegram_package_destinations.results }}"
      loop_control:
        label: "{{ item.stat.path | default(item.item | basename) }}"

    - name: Inspect existing runtime names without following links
      ansible.builtin.find:
        paths: /opt/codex-messaging/runtime
        recurse: true
        hidden: true
        file_type: any
        follow: false
      register: telegram_runtime_names
      when: telegram_reserved.results[2].stat.exists

    - name: Refuse stale runtime helpers that could shadow the reviewed bwrap
      ansible.builtin.assert:
        that:
          - telegram_runtime_names.files | map(attribute='path') | difference(['/opt/codex-messaging/runtime/bin', '/opt/codex-messaging/runtime/bin/codex', '/opt/codex-messaging/runtime/bin/bwrap']) | length == 0
        quiet: true
        fail_msg: Review and remove legacy runtime artifacts explicitly before staging this two-binary runtime.
      when: telegram_reserved.results[2].stat.exists

    - name: Inspect the private relay state directory without reading its contents
      ansible.builtin.stat:
        path: /var/lib/codex-telegram
        follow: false
      register: telegram_state

    - name: Refuse adopting another owner's state or a linked state directory
      ansible.builtin.assert:
        that:
          - not telegram_state.stat.exists or (telegram_state.stat.isdir and not telegram_state.stat.islnk and telegram_state.stat.uid | int == ansible_facts.getent_passwd[codex_telegram_user][1] | int and telegram_state.stat.mode == '0700')
        quiet: true

    - name: Require existing Python without installing packages
      ansible.builtin.stat:
        path: /usr/bin/python3
      register: telegram_python

    - name: Require an executable Python interpreter
      ansible.builtin.assert:
        that:
          - telegram_python.stat.exists
          - telegram_python.stat.executable | default(false)
        quiet: true

  tasks:
    - name: Create root-owned application and runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /opt/codex-messaging
        - /opt/codex-messaging/codex_messaging
        - /opt/codex-messaging/runtime
        - /opt/codex-messaging/runtime/bin

    - name: Create the existing user's private relay state directory
      ansible.builtin.file:
        path: /var/lib/codex-telegram
        state: directory
        owner: "{{ codex_telegram_user }}"
        group: "{{ ansible_facts.getent_passwd[codex_telegram_user][2] }}"
        mode: '0700'

    - name: Install Python package source only, excluding tests and reports
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/opt/codex-messaging/codex_messaging/{{ item | basename }}"
        owner: root
        group: root
        mode: '0644'
        follow: false
      loop: "{{ query('ansible.builtin.fileglob', telegram_source + '/codex_messaging/*.py') }}"

    - name: Install the fixed application entry point
      ansible.builtin.copy:
        src: "{{ telegram_source }}/entry.py"
        dest: /opt/codex-messaging/entry.py
        owner: root
        group: root
        mode: '0644'

    - name: Install the reviewed native runtime binaries
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "/opt/codex-messaging/runtime/bin/{{ item.name }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - {source: "{{ codex_telegram_codex_source }}", name: codex}
        - {source: "{{ codex_telegram_bwrap_source }}", name: bwrap}

    - name: Install root-controlled non-secret relay settings
      ansible.builtin.template:
        src: "{{ telegram_templates }}/codex-telegram.json.j2"
        dest: /etc/codex-telegram.json
        owner: root
        group: "{{ ansible_facts.getent_passwd[codex_telegram_user][2] }}"
        mode: '0640'

    - name: Install the disabled relay unit
      ansible.builtin.template:
        src: "{{ telegram_templates }}/codex-telegram.service.j2"
        dest: /etc/systemd/system/codex-telegram.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload unit definitions without starting or enabling the relay
      ansible.builtin.systemd_service:
        daemon_reload: true
